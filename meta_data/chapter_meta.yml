shortname: "HoloCCM"
type: Paleobook
description: "Causal analysis of the TSI-temperature relationship over the Holocene using Convergent Cross-Mapping"
thumbnail: logo.png

parts:
  - caption: "Data Preparation & Exploration"
    chapters:
      - shortname: "Standardize time axes"
        filename: "notebooks/0_Datasets/1_setup__standardize_time_axes"
        tags:
          domains: ['common time', 'data-processing']
          packages: [xarray, pandas]
      - shortname: "Detrending & high-pass filtering"
        filename: "notebooks/0_Datasets/2_setup__detrend_highpass_1kyr"
        tags:
          domains: [data-processing, filtering, detrending]
          packages: [pyleoclim, pandas]
      - shortname: "Visualizing time series & power spectra"
        filename: "notebooks/0_Datasets/3_plot__Fig1_real_ts_psd_unified"
        tags:
          domains: ['data viz', 'spectral analysis', 'solar forcing', 'Holocene temp']
          packages: [pyleoclim, matplotlib]

  - caption: "Choosing an embedding"
    chapters:
      - shortname: "Interpreting embedding params: E & τ"
        filename: "notebooks/1_Embedding/1_plot__FigS1_embedding"
        tags:
          domains: ['time delay embedding', 'data viz']
          packages: [cedarkit, matplotlib]
      - shortname: "Determining E & τ with Simplex"
        filename: "notebooks/1_Embedding/2_plot__FigS2_simplex"
        tags:
          domains: [simplex, 'param selection', 'self prediction']
          packages: [cedarkit, pyEDM]

  - caption: "Single-dyad CCM"
    chapters:
      - shortname: "Running CCM"
        filename: "notebooks/2_CCM_single_dyad/1_run__CCMlocally"
        tags:
          domains: [causality, CCM]
          packages: [cedarkit, pyEDM]
      - shortname: "Investigating an (E, τ) configuration"
        filename: "notebooks/2_CCM_single_dyad/2_plot__DataGroup_libsize_update"
        thumbnail: libsize_rho_spread.png
        tags:
          domains: [causality, CCM, 'time series alignment']
          packages: [cedarkit, matplotlib]
      - shortname: "Comparing (E, τ) configurations"
        filename: "notebooks/2_CCM_single_dyad/3_plot__DataGroup_lag"
        thumbnail: lag_spread.png
        tags:
          domains: [causality, CCM, 'parameter sweep']
          packages: [cedarkit, matplotlib]

  - caption: "Comparing CCM results across multiple dyads"
    chapters:
      - shortname: "Core dyad CCM results"
        filename: "notebooks/3_CCM_multi_dyad/1_plot__DataGroup_grid_untreated_2x2__final_result_grid"
        thumbnail: untreated_results_grid.png
        tags:
          domains: [CCM, multi-dataset-analysis, 'data viz']
          packages: [cedarkit, matplotlib]
      - shortname: "Extended CCM result overview"
        filename: "notebooks/3_CCM_multi_dyad/2_plot__DataGroup_grid__final_result_grid"
        thumbnail: extended_results.png
        tags:
          domains: [multi-dataset-analysis, 'data viz', 'parameter sweep']
          packages: [cedarkit, matplotlib]

  - caption: "Testing simple correlation"
    chapters:
      - shortname: "Calculate correlation across lag/τ"
        filename: "notebooks/4_Extras/1_calc__corr_lag_tau_resultsgrid"
        tags:
          domains: [correlation]
          packages: [numpy, pandas]
      - shortname: "Simple correlation results across lag/τ"
        filename: "notebooks/4_Extras/2_plot__corr_lag_tau_resultsgrid"
        thumbnail: corr_exp.png
        tags:
          domains: [correlation, 'data viz']
          packages: [matplotlib, pandas]

